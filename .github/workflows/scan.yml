name: BTMM Fibo 61.8 Scanner

on:
  schedule:
    - cron: '*/30 * * * *'   # toutes les 30 minutes
  workflow_dispatch: {}       # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer le scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DAYS_LOOKBACK: '2'
          TOLERANCE_PIPS: '3.0'
          RISK_USD: '140'
          USE_NEWS_FILTER: 'true'
          NEWS_IMPACT_FILTER: 'High'
          BLACKOUT_BEFORE_MIN: '15'
          BLACKOUT_AFTER_MIN: '15'
        run: python fibo_scanner.py

      - name: Sauvegarder l'etat (evite les alertes en double)
        run: |
          git config user.name "btmm-bot"
          git config user.email "btmm-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Mise a jour de l'etat du scanner"
          git push
